<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TRANSHUMANS SI</title>

  <link
    rel="icon"
    href="favicon.ico"
    type="image/x-icon"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --logo-spin-speed: 4s;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0806;
      color: #f9f9f9;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;

      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.035) 0,
        rgba(255, 255, 255, 0.035) 1px,
        rgba(0, 0, 0, 0.08) 1px,
        rgba(0, 0, 0, 0.08) 4px
      );

      opacity: 0.38;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 101;
      pointer-events: none;

      background: rgba(255, 255, 255, 0.008);
      opacity: 0.12;

      animation: crtFlicker 4.8s steps(1, end) infinite;
    }

    @keyframes crtFlicker {
      0% {
        opacity: 0.10;
      }

      8% {
        opacity: 0.13;
      }

      9% {
        opacity: 0.08;
      }

      18% {
        opacity: 0.11;
      }

      32% {
        opacity: 0.09;
      }

      33% {
        opacity: 0.14;
      }

      34% {
        opacity: 0.10;
      }

      51% {
        opacity: 0.12;
      }

      67% {
        opacity: 0.09;
      }

      68% {
        opacity: 0.13;
      }

      82% {
        opacity: 0.10;
      }

      100% {
        opacity: 0.11;
      }
    }

    .logo-stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 450px;
      perspective-origin: 50% 50%;
      pointer-events: none;
    }

    .logo-scene {
      position: relative;
      width: min(620px, 94vw, 80vh);
      aspect-ratio: 1 / 1;
      transform-style: preserve-3d;
    }

    .logo-anchor {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(420px, 67.7%);
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      z-index: 2;
    }

    .logo-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .logo-face,
    .logo-depth {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .logo-front {
      transform: translateZ(4px);

      filter:
        drop-shadow(2px 0 0 rgba(255, 35, 80, 0.48))
        drop-shadow(-2px 0 0 rgba(0, 210, 255, 0.48));
    }

    .logo-depth {
      filter: brightness(0.7);
    }

    .logo-depth-front-1 {
      transform: translateZ(3px);
    }

    .logo-depth-front-2 {
      transform: translateZ(2px);
    }

    .logo-depth-front-3 {
      transform: translateZ(1px);
    }

    .logo-depth-front-4 {
      transform: translateZ(0);
    }

    .logo-depth-front-5 {
      transform: translateZ(-1px);
    }

    .logo-depth-front-6 {
      transform: translateZ(-2px);
    }

    .logo-depth-front-7 {
      transform: translateZ(-3px);
    }

    .logo-depth-back-1 {
      transform: rotateY(180deg) translateZ(3px);
    }

    .logo-depth-back-2 {
      transform: rotateY(180deg) translateZ(2px);
    }

    .logo-depth-back-3 {
      transform: rotateY(180deg) translateZ(1px);
    }

    .logo-depth-back-4 {
      transform: rotateY(180deg) translateZ(0);
    }

    .logo-depth-back-5 {
      transform: rotateY(180deg) translateZ(-1px);
    }

    .logo-depth-back-6 {
      transform: rotateY(180deg) translateZ(-2px);
    }

    .logo-depth-back-7 {
      transform: rotateY(180deg) translateZ(-3px);
    }

    .logo-back {
      transform: rotateY(180deg) translateZ(4px);

      filter:
        drop-shadow(2px 0 0 rgba(255, 35, 80, 0.48))
        drop-shadow(-2px 0 0 rgba(0, 210, 255, 0.48));
    }

    footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      padding: 20px 24px;
      text-align: center;
      background: linear-gradient(0deg, rgba(9,7,6,.92), rgba(9,7,6,0));
      z-index: 10;
    }

    .footer-text {
      font-size: 11px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #dddddd;
      font-weight: 500;
    }

    @media (prefers-reduced-motion: reduce) {
      body::after {
        animation: none;
      }
    }
    /* Cinematic bronze atmosphere, behind the interactive logo */
    #atmosphere { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
    .logo-stage { z-index:2; }
    footer { pointer-events:none; }
    body::before { z-index:8; opacity:.16; }
    body::after { z-index:9; }
    @media (prefers-reduced-motion: reduce) { #atmosphere { opacity:.8; } }
  </style>
</head>

<body>

  <canvas id="atmosphere" aria-hidden="true"></canvas>
  <main class="logo-stage">

          <img

          />

          <img

          <img
            src="HP.png"

          <img

          <img

          />

          <img

          />

          <img
            src="HP.png"

            class="logo-depth logo-depth-back-2"

          <img

  <footer>
    <p class="footer-text">
      TRANSHUMANS SI © <span id="year"></span>. All rights reserved.
    </p>
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();

    const logoWrap =
      document.getElementById("logoWrap");

    let currentRotationX = 0;
    let currentRotationY = 0;
    let currentRotationZ = 0;

    let targetRotationX = 0;
    let targetRotationY = 0;
    let targetRotationZ = 0;

    const maxRotationX = 7;
    const maxRotationY = 10;
    const maxRotationZ = 1.5;

    const smoothing = 0.075;

    document.addEventListener(
      "mousemove",
      (event) => {

        const mouseX =
          (event.clientX / window.innerWidth) * 2 - 1;

        const mouseY =
          (event.clientY / window.innerHeight) * 2 - 1;

        targetRotationY =
          mouseX * maxRotationY;

        targetRotationX =
          -mouseY * maxRotationX;

        targetRotationZ =
          mouseX *
          mouseY *
          maxRotationZ;
      }
    );

    document.addEventListener(
      "mouseleave",
      () => {

        targetRotationX = 0;
        targetRotationY = 0;
        targetRotationZ = 0;
      }
    );

    let isTouching = false;

    let touchStartX = 0;
    let touchStartY = 0;

    let touchStartRotationX = 0;
    let touchStartRotationY = 0;

    document.addEventListener(
      "touchstart",
      (event) => {

        if (event.touches.length !== 1) {
          return;
        }

        isTouching = true;

        const touch = event.touches[0];

        touchStartX = touch.clientX;
        touchStartY = touch.clientY;

        touchStartRotationX =
          targetRotationX;

        touchStartRotationY =
          targetRotationY;
      },
      {
        passive: false
      }
    );

    document.addEventListener(
      "touchmove",
      (event) => {

        if (
          !isTouching ||
          event.touches.length !== 1
        ) {
          return;
        }

        event.preventDefault();

        const touch = event.touches[0];

        const deltaX =
          touch.clientX - touchStartX;

        const deltaY =
          touch.clientY - touchStartY;

        const touchSensitivity = 0.07;

        targetRotationY =
          touchStartRotationY +
          deltaX * touchSensitivity;

        targetRotationX =
          touchStartRotationX -
          deltaY * touchSensitivity;

        targetRotationY = Math.max(
          -maxRotationY,
          Math.min(
            maxRotationY,
            targetRotationY
          )
        );

        targetRotationX = Math.max(
          -maxRotationX,
          Math.min(
            maxRotationX,
            targetRotationX
          )
        );

        targetRotationZ =
          (targetRotationY / maxRotationY) *
          (targetRotationX / maxRotationX) *
          maxRotationZ;
      },
      {
        passive: false
      }
    );

    document.addEventListener(
      "touchend",
      () => {
        isTouching = false;
      },
      {
        passive: true
      }
    );

    document.addEventListener(
      "touchcancel",
      () => {
        isTouching = false;
      },
      {
        passive: true
      }
    );

    function animate(time) {

      currentRotationX +=
        (targetRotationX - currentRotationX) *
        smoothing;

      currentRotationY +=
        (targetRotationY - currentRotationY) *
        smoothing;

      currentRotationZ +=
        (targetRotationZ - currentRotationZ) *
        smoothing;

      const floatY =
        Math.sin(time * 0.0011) * 3;

      const floatX =
        Math.sin(time * 0.00073) * 1;

      const floatZ =
        Math.sin(time * 0.00087) * 2;

      logoWrap.style.transform = `
        translate3d(
          ${floatX}px,
          ${floatY}px,
          ${floatZ}px
        )
        rotateX(${currentRotationX}deg)
        rotateY(${currentRotationY}deg)
        rotateZ(${currentRotationZ}deg)
      `;

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>

  <script>
    // Glass-shard field: deterministic, smooth and resolution-independent.
    (() => {
      const canvas = document.getElementById('atmosphere');
      const ctx = canvas.getContext('2d', {alpha:false});
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
      let w=0,h=0,dpr=1, last=0, time=0;
      const rand = (seed) => {let x=Math.sin(seed*127.1+78.233)*43758.5453; return x-Math.floor(x);};
      const shards = Array.from({length:47},(_,i)=>({
        x:rand(i+11), y:rand(i+77), size:7+rand(i+49)*36,
        speed:.012+rand(i+24)*.014, spin:(rand(i+54)-.5)*.19,
        angle:rand(i+81)*Math.PI*2, alpha:.10+rand(i+8)*.20,
        depth:.55+rand(i+35)*.9, phase:rand(i+16)*Math.PI*2,
        side:rand(i+93)>.5?1:-1
      }));
      function resize(){
        w=window.innerWidth;h=window.innerHeight;dpr=Math.min(devicePixelRatio||1,2);
        canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
        ctx.setTransform(dpr,0,0,dpr,0,0);
      }
      function draw(now){
        const dt=Math.min((now-last)/1000||0,.05);last=now;
        if(!reduced.matches)time+=dt;
        ctx.clearRect(0,0,w,h);
        const base=ctx.createLinearGradient(0,0,w,h);
        base.addColorStop(0,'#090706');base.addColorStop(.38,'#21170e');
        base.addColorStop(.72,'#130e0a');base.addColorStop(1,'#070605');
        ctx.fillStyle=base;ctx.fillRect(0,0,w,h);
        function glow(x,y,r,color){
          const g=ctx.createRadialGradient(x,y,0,x,y,r);
          g.addColorStop(0,color);g.addColorStop(1,'rgba(100,60,20,0)');
          ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
        }
        glow(w*.46,h*.53,Math.max(w,h)*.65,'rgba(128,76,26,.19)');
        glow(w*.90,h*.44,Math.max(w,h)*.52,'rgba(141,87,28,.12)');
        glow(w*.17,h*.82,Math.max(w,h)*.48,'rgba(103,63,26,.11)');
        // Two drifting diagonal constellations, intentionally clear around the logo.
        for(let i=0;i<shards.length;i++){
          const s=shards[i], t=time*s.speed*s.depth;
          const u=(s.x+t)%1;
          const x=(s.side>0 ? .56+u*.38 : .02+u*.37)*w;
          const y=(s.side>0 ? .05+(.74-u)*.46 : .91-u*.47)*h
                  +Math.sin(time*.21+s.phase)*h*.017;
          const size=s.size*Math.min(w/1200,1.45)*s.depth;
          ctx.save();ctx.translate(x,y);ctx.rotate(s.angle+time*s.spin);
          ctx.globalAlpha=s.alpha;
          const fill=ctx.createLinearGradient(-size,-size,size,size);
          fill.addColorStop(0,'rgba(242,201,126,.28)');
          fill.addColorStop(.48,'rgba(179,137,73,.055)');
          fill.addColorStop(1,'rgba(245,212,154,.15)');
          ctx.beginPath();ctx.moveTo(-size*.62,size*.47);
          ctx.lineTo(size*.10,-size*.70);ctx.lineTo(size*.75,size*.51);
          ctx.closePath();ctx.fillStyle=fill;ctx.fill();
          ctx.strokeStyle='rgba(241,195,115,.75)';ctx.lineWidth=.7;ctx.stroke();
          ctx.beginPath();ctx.moveTo(size*.10,-size*.70);
          ctx.lineTo(size*.06,size*.10);ctx.lineTo(size*.75,size*.51);
          ctx.strokeStyle='rgba(255,227,173,.21)';ctx.stroke();
          ctx.restore();
        }
        // Gentle vignette makes the center emblem pop.
        const v=ctx.createRadialGradient(w*.5,h*.5,Math.min(w,h)*.1,w*.5,h*.5,Math.max(w,h)*.78);
        v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.72)');
        ctx.fillStyle=v;ctx.fillRect(0,0,w,h);
        requestAnimationFrame(draw);
      }
      window.addEventListener('resize',resize,{passive:true});
      resize();requestAnimationFrame(draw);
    })();
  </script>
</body>
